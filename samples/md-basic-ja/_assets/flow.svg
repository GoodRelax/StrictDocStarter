<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"
     font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="250" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- main flow -->
  <g stroke="#334155" stroke-width="1.5" fill="#f1f5f9">
    <rect x="20"  y="40" width="130" height="52" rx="6"/>
    <rect x="215" y="40" width="130" height="52" rx="6"/>
    <rect x="410" y="40" width="130" height="52" rx="6"/>
    <rect x="605" y="40" width="130" height="52" rx="6"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="85"  y="63">input file</text>
    <text x="280" y="63">format check</text>
    <text x="475" y="63">convert</text>
    <text x="670" y="63">output file</text>
  </g>
  <g fill="#64748b" text-anchor="middle" font-size="11">
    <text x="280" y="81">SW-002</text>
    <text x="475" y="81">SW-001</text>
    <text x="670" y="81">SW-003 / SW-004</text>
  </g>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 150 66 L 210 66"/>
    <path d="M 345 66 L 405 66"/>
    <path d="M 540 66 L 600 66"/>
  </g>

  <!-- guard branches -->
  <g stroke="#b91c1c" stroke-width="1.5" fill="#fef2f2">
    <rect x="215" y="160" width="130" height="46" rx="6"/>
    <rect x="605" y="160" width="130" height="46" rx="6"/>
  </g>
  <g fill="#7f1d1d" text-anchor="middle">
    <text x="280" y="188">stop</text>
    <text x="670" y="188">stop</text>
  </g>

  <g stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"
     stroke-dasharray="5 4">
    <path d="M 280 92 L 280 155"/>
    <path d="M 670 92 L 670 155"/>
  </g>
  <g fill="#b91c1c" font-size="11">
    <text x="290" y="128">unexpected format</text>
    <text x="680" y="128">output exists</text>
  </g>
</svg>
