<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"
     font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <!--
    Colours are declared once below and switched by prefers-color-scheme, the
    same mechanism StrictDoc uses for its own favicon. An external SVG cannot
    read the theme of the page that embeds it, so this follows the operating
    system setting. That matches the launcher's default colour mode (auto); if
    you force light or dark with change-color-mode.bat and your OS disagrees,
    this diagram follows the OS.
  -->
  <style>
    .bg       { fill: #ffffff; }
    .box      { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; }
    .txt      { fill: #0f172a; }
    .sub      { fill: #64748b; }
    .flow     { stroke: #334155; stroke-width: 1.5; fill: none; }
    .head     { fill: #334155; }
    .stop-box { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .stop-txt { fill: #7f1d1d; }
    .stop-arw { stroke: #b91c1c; stroke-width: 1.5; fill: none; }
    .stop-lbl { fill: #b91c1c; }
    .stop-head { fill: #b91c1c; }

    @media (prefers-color-scheme: dark) {
      .bg       { fill: #12161c; }
      .box      { fill: #1b2027; stroke: #7ea8d8; }
      .txt      { fill: #c9d1d9; }
      .sub      { fill: #8b949e; }
      .flow     { stroke: #8b949e; }
      .head     { fill: #8b949e; }
      .stop-box { fill: #2a1416; stroke: #f85149; }
      .stop-txt { fill: #ffa198; }
      .stop-arw { stroke: #f85149; }
      .stop-lbl { fill: #f85149; }
      .stop-head { fill: #f85149; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="250"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="stop-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- main flow -->
  <g class="box">
    <rect x="20"  y="40" width="130" height="52" rx="6"/>
    <rect x="215" y="40" width="130" height="52" rx="6"/>
    <rect x="410" y="40" width="130" height="52" rx="6"/>
    <rect x="605" y="40" width="130" height="52" rx="6"/>
  </g>
  <g class="txt" text-anchor="middle">
    <text x="85"  y="63">input file</text>
    <text x="280" y="63">format check</text>
    <text x="475" y="63">destination check</text>
    <text x="670" y="63">output file</text>
  </g>
  <g class="sub" text-anchor="middle" font-size="11">
    <text x="280" y="81">SW-002</text>
    <text x="475" y="81">SW-003</text>
    <text x="670" y="81">SW-001 / SW-004</text>
  </g>

  <g class="flow" marker-end="url(#arrow)">
    <path d="M 150 66 L 210 66"/>
    <path d="M 345 66 L 405 66"/>
    <path d="M 540 66 L 600 66"/>
  </g>

  <!-- guard branches -->
  <g class="stop-box">
    <rect x="215" y="160" width="130" height="46" rx="6"/>
    <rect x="410" y="160" width="130" height="46" rx="6"/>
  </g>
  <g class="stop-txt" text-anchor="middle">
    <text x="280" y="188">stop</text>
    <text x="475" y="188">stop</text>
  </g>

  <g class="stop-arw" marker-end="url(#arrow-stop)" stroke-dasharray="5 4">
    <path d="M 280 92 L 280 155"/>
    <path d="M 475 92 L 475 155"/>
  </g>
  <g class="stop-lbl" font-size="11">
    <text x="290" y="128">unexpected format</text>
    <text x="485" y="128">output exists</text>
  </g>
</svg>
